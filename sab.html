<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carta - Bom Dia</title>
<style>
    body {
        background: #f2f0ff;
        font-family: "Georgia", serif;
        padding: 40px;
    }
    .carta {
        background: #ffffff;
        width: 600px;
        margin: auto;
        padding: 40px 50px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.15);
        line-height: 1.7;
        font-size: 18px;
    }
    h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #5a3ca9;
    }
</style>
</head>
<body>

<div class="carta">
    <h2>Bom dia, sabre</h2>

    <p>Espero que esta mensagem encontre você bem.  
    Só passei para te desejar um dia leve, bonito e cheio de coisas boas.</p>

    <p>Que hoje algo pequeno te faça sorrir,  
    que algo simples te traga paz,  
    e que você se sinta acolhida onde estiver.</p>


    <p>Com carinho,<br>
    <strong>— Vic</strong></p>
</div>

</body>
</html>
